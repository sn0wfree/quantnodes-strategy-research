name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
      - name: Ruff
        run: ruff check src

  unit:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Resolve shard ${{ matrix.shard }}
        id: shard
        run: |
          # time-aware mode: LPT pack by .shard-timings.json, falls back to
          # round-robin if the file is missing or empty.
          FILES=$(python scripts/pytest_shard.py \
            --mode time-aware --shard ${{ matrix.shard }} --shards 4)
          echo "count=$(echo "$FILES" | grep -c . || true)" >> "$GITHUB_OUTPUT"
          echo "$FILES" > /tmp/shard_files.txt
          head -5 /tmp/shard_files.txt

      - name: Run tests (shard ${{ matrix.shard }}/4)
        run: |
          if [ ! -s /tmp/shard_files.txt ]; then
            echo "empty shard, skip"
            exit 0
          fi
          # PR lane: llm/e2e/slow excluded (docs/test-marker-lanes-design.md).
          # push to main runs the FULL suite — merge has no feedback SLA.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python -m pytest $(tr '\n' ' ' < /tmp/shard_files.txt) \
              -q --tb=short --reruns=2 --reruns-delay=1 --durations=20 \
              -m "not llm and not e2e and not slow"
          else
            python -m pytest $(tr '\n' ' ' < /tmp/shard_files.txt) \
              -q --tb=short --reruns=2 --reruns-delay=1 --durations=20
          fi

      - name: Upload TUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-screenshots-py${{ matrix.python-version }}-s${{ matrix.shard }}
          path: tui-captures/
          retention-days: 14

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-py${{ matrix.python-version }}-s${{ matrix.shard }}
          path: |
            .pytest_cache/v/cache/lastfailed
            .pytest_cache/v/cache/nodeids
          retention-days: 7
          if-no-files-found: ignore

  eval-sim:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Golden task sanity (no LLM)
        run: |
          python evals/run_evals.py
          python -m pytest tests/test_eval_scorecard.py -q --tb=short
