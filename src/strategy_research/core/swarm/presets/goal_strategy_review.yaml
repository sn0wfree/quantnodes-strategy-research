name: goal_strategy_review
description: 策略归因分析 + 因子衰减检查 + 基准比较 + 总结
version: "1.0"

goal:
  default_criteria:
    - "已完成 PnL 归因分析"
    - "已检查因子衰减趋势"
    - "已对比策略与基准表现"
    - "已记录策略优劣势"
    - "已生成结构化策略审查报告"
  risk_tier: research_general

agents:
  - id: pnl_attribution
    prompt_file: .prompts/attribution_analyst.md
    tools: [analysis, run_backtest]
    input_from: []
    evidence_criterion: 0
    timeout: 180
    max_retries: 2

  - id: icarus_review
    prompt_file: .prompts/icarus_review.md
    tools: [analysis]
    input_from: [pnl_attribution]
    evidence_criterion: 1
    timeout: 120
    max_retries: 2

  - id: factor_decay
    prompt_file: .prompts/factor_analyst.md
    tools: [compute_factor, run_backtest]
    input_from: [pnl_attribution]
    evidence_criterion: 2
    timeout: 300
    max_retries: 3

  - id: benchmark_compare
    prompt_file: .prompts/benchmark_compare.md
    tools: [analysis, run_backtest]
    input_from: [pnl_attribution, factor_decay]
    evidence_criterion: 3
    timeout: 180
    max_retries: 2

  - id: summary_writer
    prompt_file: .prompts/report_writer.md
    tools: [markdown]
    input_from: [icarus_review, factor_decay, benchmark_compare]
    evidence_criterion: 4
    timeout: 120
    max_retries: 2

dag:
  pnl_attribution: []
  icarus_review: [pnl_attribution]
  factor_decay: [pnl_attribution]
  benchmark_compare: [pnl_attribution, factor_decay]
  summary_writer: [icarus_review, factor_decay, benchmark_compare]

completion:
  mode: auto
  auto_audit: true
  require_all_evidence: true