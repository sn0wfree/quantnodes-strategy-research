<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ok" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#059669" stroke-width="1.2"/>
    </marker>
    <marker id="bad" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    </marker>
  </defs>
  <text x="40" y="28" font-size="14" font-weight="500" fill="#0f172a">依赖方向审计 — 期望向下（绿） vs 实际反向（红）</text>

  <!-- expected layers -->
  <rect x="80" y="50" width="200" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="0.5"/>
  <text x="180" y="77" font-size="13" fill="#065f46" text-anchor="middle">api / cli</text>

  <rect x="80" y="130" width="200" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="0.5"/>
  <text x="180" y="157" font-size="13" fill="#065f46" text-anchor="middle">core/study · core/agent</text>

  <rect x="80" y="210" width="200" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="0.5"/>
  <text x="180" y="237" font-size="13" fill="#065f46" text-anchor="middle">engine / tools</text>

  <rect x="80" y="290" width="200" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="0.5"/>
  <text x="180" y="317" font-size="13" fill="#065f46" text-anchor="middle">db · event_store · fs</text>

  <!-- green arrows down -->
  <line x1="180" y1="94" x2="180" y2="130" stroke="#059669" stroke-width="1" marker-end="url(#ok)"/>
  <line x1="180" y1="174" x2="180" y2="210" stroke="#059669" stroke-width="1" marker-end="url(#ok)"/>
  <line x1="180" y1="254" x2="180" y2="290" stroke="#059669" stroke-width="1" marker-end="url(#ok)"/>

  <!-- actual violations -->
  <rect x="380" y="70" width="260" height="220" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.5"/>
  <text x="396" y="94" font-size="12" font-weight="500" fill="#991b1b">实际反向边（core → api）</text>

  <text x="400" y="128" font-size="12" fill="#7f1d1d">event_store.py → projector</text>
  <text x="400" y="152" font-size="11" fill="#b91c1c">事件内核绑死 HTTP 投影</text>

  <text x="400" y="188" font-size="12" fill="#7f1d1d">langgraph_engine → bridge_v2</text>
  <text x="400" y="212" font-size="11" fill="#b91c1c">引擎感知 SSE 传输</text>

  <text x="400" y="248" font-size="12" fill="#7f1d1d">scheduler → web_session._get_db</text>
  <text x="400" y="272" font-size="11" fill="#b91c1c">编排打到路由私有符号</text>

  <!-- red arrows -->
  <line x1="280" y1="150" x2="380" y2="120" stroke="#dc2626" stroke-width="1.2" marker-end="url(#bad)"/>
  <line x1="280" y1="160" x2="380" y2="190" stroke="#dc2626" stroke-width="1.2" marker-end="url(#bad)"/>
  <line x1="280" y1="170" x2="380" y2="250" stroke="#dc2626" stroke-width="1.2" marker-end="url(#bad)"/>

  <text x="40" y="350" font-size="11" fill="#64748b">分层叙事成立的前提：反向边 = 0。建议 CI 加 import 方向门禁。</text>
</svg>
