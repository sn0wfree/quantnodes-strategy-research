<svg viewBox="0 0 1600 1650" width="1600" height="1650" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .lyr{font-size:14px;font-weight:600;fill:#334155}
    .bt{font-size:15px;font-weight:600;fill:#0f172a}
    .st{font-size:12.5px;fill:#475569}
    .sm{font-size:11.5px;fill:#94a3b8}
    .hub{font-size:14.5px;font-weight:600;fill:#0c4a6e}
    .hq{font-size:12.5px;fill:#0369a1}
    .flow-lbl{font-size:12px;font-weight:500;fill:#0c4a6e}
    .box{fill:#fff;stroke:#cbd5e1;stroke-width:1}
    .boxb{fill:#e0f2fe;stroke:#7dd3fc;stroke-width:1.2}
    .boxa{fill:#fef3c7;stroke:#fcd34d;stroke-width:1.2}
    .boxd{fill:#f1f5f9;stroke:#334155;stroke-width:1.6;stroke-dasharray:7 4}
    .boxg{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1}
    .arb{stroke:#0ea5e9;stroke-width:1.4;fill:none;marker-end:url(#a2)}
  </style>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8" fill="none" stroke="#0ea5e9" stroke-width="1.4"/></marker>
  </defs>

  <!-- ═══ ① 渠道 ═══ -->
  <text x="40" y="50" class="lyr">① 渠道</text>
  <rect x="150" y="20" width="250" height="66" rx="9" class="box"/>
  <text x="166" y="44" class="bt">CLI / TUI</text>
  <text x="166" y="64" class="st">命令 · 终端 · 交互</text>
  <rect x="413" y="20" width="250" height="66" rx="9" class="box"/>
  <text x="429" y="44" class="bt">FastAPI（20 routers）</text>
  <text x="429" y="64" class="st">chat · study · session</text>
  <rect x="676" y="20" width="250" height="66" rx="9" class="box"/>
  <text x="692" y="44" class="bt">WebUI</text>
  <text x="692" y="64" class="st">SSE 时间线（同走 chat）</text>
  <rect x="939" y="20" width="250" height="66" rx="9" class="box"/>
  <text x="955" y="44" class="bt">MCP</text>
  <text x="955" y="64" class="st">对外工具协议</text>
  <text x="150" y="106" class="sm">哑适配器：只构造 WorkRequest + 订阅事件流，不含任何裁决</text>
  <line x1="275" y1="112" x2="275" y2="146" class="arb"/>
  <line x1="538" y1="112" x2="538" y2="146" class="arb"/>
  <line x1="801" y1="112" x2="801" y2="146" class="arb"/>
  <line x1="1064" y1="112" x2="1064" y2="146" class="arb"/>
  <text x="430" y="134" class="flow-lbl">WorkRequest（同一份契约 · kind / source / session_key / payload / queue_mode / budget / idempotency_key / deadline）</text>

  <!-- ═══ 平台虚线框（Gateway + 执行面 + 平台数据） ═══ -->
  <rect x="138" y="132" width="1062" height="1188" rx="12" class="boxd" style="fill:none"/>
  <text x="146" y="146" class="sm" style="font-weight:600">平台（业务无关）：控制面 + 执行面 + 平台数据面 —— 研究域挂在外面</text>

  <!-- ═══ ② Gateway ═══ -->
  <text x="40" y="180" class="lyr">② Gateway</text>
  <rect x="150" y="150" width="1039" height="640" rx="10" class="boxb"/>
  <text x="166" y="176" class="hub">Gateway（单进程 · 唯一控制面 · 一个信任域）—— 一个 owner 对一件事</text>
  <text x="166" y="196" class="hq">收下即进 mailbox · 运行的一切事实经事件流 · 回执只有 accepted / rejected(reason)</text>
  <line x1="166" y1="208" x2="1173" y2="208" stroke="#bae6fd"/>

  <rect x="166" y="220" width="1007" height="44" rx="6" class="boxg"/>
  <text x="180" y="240" class="st">协议端点（薄 · 无状态 · 快同步）：契约校验 · 幂等去重 · 转发 mailbox —— 入口不是一个层</text>
  <text x="180" y="258" class="sm">宿主：挂载式单进程（qs gateway · workers=1 自检）· 重启=fold 重建 · auto_resume=false · 关闭等 grace</text>

  <rect x="166" y="282" width="320" height="190" rx="8" class="box"/>
  <text x="180" y="306" class="bt">mailbox</text>
  <text x="180" y="330" class="st">session lane 先串行 → 容量组闸后放行</text>
  <text x="180" y="350" class="st">深度 cap 20 · 溢出 summarize（拒绝唯一处）</text>
  <text x="180" y="370" class="st">steer 邮箱：FIFO · 同安全点合批 · 注入只追加</text>
  <text x="180" y="390" class="st">优先级老化：领先有界，防饿死用户消息</text>
  <text x="180" y="418" class="sm">默认：cli=followup · api_chat=steer</text>
  <text x="180" y="436" class="sm">automation=interrupt · collect 留位</text>

  <rect x="498" y="282" width="320" height="190" rx="8" class="box"/>
  <text x="512" y="306" class="bt">SessionController</text>
  <text x="512" y="330" class="st">turn 准入：谁下一个可以跑</text>
  <text x="512" y="350" class="st">7 阶段 · 4 队列模式 · 6 正交真值</text>
  <text x="512" y="370" class="st">write fence：activeRunId 认领 + 提交校验</text>
  <text x="512" y="390" class="st">session=串行域：turn 不分类型同一条队</text>
  <text x="512" y="410" class="sm">study.home_session_key：round 皆入 home · 同实体永不并行</text>
  <text x="512" y="428" class="sm">切 A2（骨架）· A3（fence）· B4（身份）</text>

  <rect x="830" y="282" width="343" height="190" rx="8" class="boxd"/>
  <text x="844" y="306" class="bt">Director（策略）</text>
  <text x="844" y="330" class="st">停因 → 动作 · propose_next</text>
  <text x="844" y="350" class="st">产出 = BranchContext（复用）</text>
  <text x="844" y="370" class="st">以 followup 提交 mailbox</text>
  <text x="844" y="396" class="sm">红线：不读预算 · 不得自行开 run</text>
  <text x="844" y="414" class="sm">（唯一开 run 路径 = admission）</text>

  <rect x="166" y="492" width="320" height="190" rx="8" class="box"/>
  <text x="180" y="516" class="bt">RuntimeHub</text>
  <text x="180" y="540" class="st">解析每个 turn 用什么执行：</text>
  <text x="180" y="560" class="st">preset 图 + provider/模型绑定</text>
  <text x="180" y="580" class="st">解析序：model > provider > auto > 回退</text>
  <text x="180" y="600" class="st">不支持则拒绝，不降级 · 失败不经别 preset 重放</text>
  <text x="180" y="620" class="st">provider client 层带 RPM/TPM 限流（排队不拒绝）</text>
  <text x="180" y="638" class="sm">切 A1</text>

  <rect x="498" y="492" width="320" height="190" rx="8" class="box"/>
  <text x="512" y="516" class="bt">ContextHub（= Prompt Assembly）</text>
  <text x="512" y="540" class="st">collect → arbitrate → render → explain</text>
  <text x="512" y="560" class="st">稳定段在上 · 目录在下（前缀不变）</text>
  <text x="512" y="580" class="st">预算谁产出谁拥有 · 超限触发压缩（runtime 摘要）</text>
  <text x="512" y="608" class="sm">Provider：goal/todo/memory/hypothesis</text>
  <text x="512" y="626" class="sm">只取数 + 标注，不做业务 · 切 A4 · B2</text>

  <rect x="830" y="492" width="343" height="190" rx="8" class="box"/>
  <text x="844" y="516" class="bt">Scheduler（唯一）· EventStore</text>
  <text x="844" y="540" class="st">插件注册任务 · 宿主一个定时器</text>
  <text x="844" y="560" class="st">持久化只存 deadline，重建计划</text>
  <text x="844" y="580" class="st">emit / subscribe / replay</text>
  <text x="844" y="608" class="sm">事件不重放，缺口靠刷新 · 切 C5 · 1.6</text>

  <rect x="166" y="690" width="1007" height="46" rx="8" class="box"/>
  <text x="180" y="708" class="bt">容量组闸（闸不是队 · 等待在 mailbox）</text>
  <text x="180" y="726" class="st">chat 宽 / study 窄（=executor 池上限联动）/ cron 隔离 + 嵌套占位 ｜ executor 单池+闸 ｜ 满→排队不拒绝 · running 不抢占</text>

  <rect x="166" y="746" width="1007" height="64" rx="8" class="boxd"/>
  <text x="180" y="770" class="bt">RunContext（turn 准备产物 · per-run 非全局）</text>
  <text x="180" y="792" class="st">预算快照 · EventSink · CancelScope · TraceView · 注入通道 —— 回答「在什么约束下跑」，不含「做什么」</text>

  <!-- ═══ ③ 执行面 ═══ -->
  <line x1="665" y1="810" x2="665" y2="848" class="arb"/>
  <text x="675" y="834" class="flow-lbl">intent（BranchContext）+ RunContext</text>
  <text x="40" y="880" class="lyr">③ 执行面</text>

  <rect x="150" y="852" width="1039" height="64" rx="9" class="boxa"/>
  <text x="166" y="876" class="bt">GraphEngine —— 包裹 langgraph · 支持环 · prepare / run / settle（唯一 runtime）</text>
  <text x="166" y="900" class="st">T1 协程层：进程内 asyncio（llm/react 节点 · 等 LLM 的轻活）｜ T2 进程层：cpu 节点 → ExecutorBridge → 常驻子进程池·单池+闸（烧 CPU 重活 · 可硬杀）｜ T3 沙箱层：不可信代码（两段式·占位）</text>

  <rect x="150" y="916" width="330" height="130" rx="9" class="box"/>
  <text x="166" y="940" class="bt">节点类型（每阶段开/关 ReAct）</text>
  <text x="166" y="962" class="st">llm 单发（关）· react 循环（开）</text>
  <text x="166" y="982" class="st">cpu → 子进程池 · graph 子图嵌套</text>
  <text x="166" y="1002" class="st">react 内部 = 现 AgentLoop 平移</text>
  <text x="166" y="1030" class="sm">切 A1（引擎骨架 + 节点类型）</text>
  <rect x="500" y="916" width="330" height="130" rx="9" class="box"/>
  <text x="516" y="940" class="bt">Preset 注册表（图 = 纯数据）</text>
  <text x="516" y="962" class="st">chat = 单 react 节点退化图</text>
  <text x="516" y="982" class="st">research = 方法论阶段图【Tier 0 冻结】</text>
  <text x="516" y="1002" class="st">fanout / dag 形状【Tier 1 可提案】</text>
  <text x="516" y="1030" class="sm">切 B1（research preset 化）· D2 提案</text>
  <rect x="850" y="916" width="339" height="130" rx="9" class="box"/>
  <text x="866" y="940" class="bt">执行红线（引擎性质 · 不入配置）</text>
  <text x="866" y="962" class="st">图根 = turn，走 mailbox 准入</text>
  <text x="866" y="982" class="st">cpu 子 run 不得为 study round</text>
  <text x="866" y="1002" class="st">取消连坐 · fence 挂根 · 事件带 run_id</text>
  <text x="866" y="1030" class="sm">子代理 lane subagent:{session}（默认 8）</text>

  <!-- ═══ ④ 平台数据面（框内） ═══ -->
  <line x1="430" y1="1046" x2="430" y2="1096" class="arb"/>
  <text x="440" y="1074" class="flow-lbl">运行事件 · 产物指针（大件走登记 P-3）</text>
  <text x="40" y="1120" class="lyr">④ 平台数据</text>
  <text x="40" y="1138" class="sm">业务无关 · 机制</text>

  <text x="150" y="1152" class="st" style="font-weight:600">平台数据面（P-1 … P-5）—— sessions/{id}.sqlite 自包含（event+blobs+message+goal/todo）+ platform.sqlite 全局小库（10-26 定）</text>

  <rect x="150" y="1162" width="250" height="100" rx="9" class="box"/>
  <text x="166" y="1186" class="bt">事实流（P-1）</text>
  <text x="166" y="1208" class="st">session 库内 event_log · emit/replay</text>
  <text x="166" y="1228" class="st">全量含流式 delta · 永久保留不清理</text>
  <text x="166" y="1250" class="sm">切 0.2 双轨 · 1.6 协议化 · 归档=纯导出</text>
  <rect x="413" y="1162" width="250" height="100" rx="9" class="box"/>
  <text x="429" y="1186" class="bt">运行状态库（P-2）</text>
  <text x="429" y="1208" class="st">每 session 一库：event+blobs+message+goal/todo</text>
  <text x="429" y="1228" class="st">WAL 读写并发 · projector 边界折叠 · 懒加载</text>
  <text x="429" y="1250" class="sm">切 2.4 拆分 · owner=PlatformStore（不变量7）</text>
  <rect x="676" y="1162" width="250" height="100" rx="9" class="boxd"/>
  <text x="692" y="1186" class="bt">工件登记（P-3 · 待建）</text>
  <text x="692" y="1208" class="st">全局库登记索引 + 指针</text>
  <text x="692" y="1228" class="st">大产物唯一通道 · 两步可见</text>
  <text x="692" y="1250" class="sm">回测结果是第一个用户 · 兼跨会话发现</text>
  <rect x="939" y="1162" width="250" height="100" rx="9" class="boxd"/>
  <text x="955" y="1186" class="bt">身份原语 + 指针（P-4/5 · 待建）</text>
  <text x="955" y="1208" class="st">四层派生 id：turn→run→子→artifact</text>
  <text x="955" y="1228" class="st">血统三件套 + 指针四件套</text>
  <text x="955" y="1250" class="sm">切 B4 · turn:run=1:N（不变量 8）</text>

  <rect x="150" y="1272" width="1039" height="34" rx="8" class="boxa"/>
  <text x="166" y="1294" class="st">接缝规则：研究域不许私开存储通道 —— 大产物走登记(P-3) · 事实走事件流(P-1) · id 挂血统(P-4)</text>

  <!-- ═══ ⑤ 研究域（单独一层 · 框外） ═══ -->
  <line x1="430" y1="1320" x2="430" y2="1356" class="arb"/>
  <text x="440" y="1342" class="flow-lbl">落位：产物经登记 · 事实经事件流 · id 挂血统</text>
  <text x="40" y="1396" class="lyr">⑤ 研究域</text>
  <text x="40" y="1414" class="sm">我们的 IP · 不动</text>

  <text x="150" y="1368" class="st" style="font-weight:600">研究域数据面（业务有关 · D-1 … D-5）</text>

  <rect x="150" y="1378" width="250" height="100" rx="9" class="boxa"/>
  <text x="166" y="1402" class="bt">研究方法论（不动）</text>
  <text x="166" y="1424" class="st">假设→派生→证伪(claims)</text>
  <text x="166" y="1444" class="st">→ AEGIS 门 → 两阶段 journal</text>
  <text x="166" y="1466" class="sm">切 C1（等控制面 OK）</text>
  <rect x="413" y="1378" width="250" height="100" rx="9" class="box"/>
  <text x="429" y="1402" class="bt">研究账本</text>
  <text x="429" y="1424" class="st">hypothesis/claims/journal/study</text>
  <text x="429" y="1444" class="st">真源 · 写入者 · 生命周期 · 幂等</text>
  <text x="429" y="1466" class="sm">切 0.4 契约 · B4 身份</text>
  <rect x="676" y="1378" width="250" height="100" rx="9" class="box"/>
  <text x="692" y="1402" class="bt">市场数据 market.duckdb</text>
  <text x="692" y="1424" class="st">价格 · 因子 · 读多写少</text>
  <text x="692" y="1444" class="st">接入任务专写（独立写者）</text>
  <text x="692" y="1466" class="sm">切 2.4 读写分仓</text>
  <rect x="939" y="1378" width="250" height="100" rx="9" class="box"/>
  <text x="955" y="1402" class="bt">回测结果 + round 目录</text>
  <text x="955" y="1424" class="st">studies/{study_id}/rounds/ 布局（D-4 定）</text>
  <text x="955" y="1444" class="st">登记行走 P-3 · strategy.py 可 git</text>
  <text x="955" y="1466" class="sm">P-5 指针四件套 · 根=workspace</text>

  <!-- ═══ 底带 ═══ -->
  <rect x="150" y="1500" width="520" height="130" rx="10" class="boxg"/>
  <text x="166" y="1526" class="bt">接缝规范</text>
  <text x="166" y="1550" class="st">L1 窄协议 · L2 统一注册（扩展 core/registry.py）· L3 一致性套件</text>
  <text x="166" y="1570" class="st">hook 红线：只读不改控制流（与 OpenClaw 一致）</text>
  <text x="166" y="1590" class="st">PROTOCOL_VERSION，不匹配即拒绝（切 B3）</text>
  <rect x="690" y="1500" width="499" height="130" rx="10" class="boxa"/>
  <text x="706" y="1526" class="bt">基因组（RSI）· 只改行为工件</text>
  <text x="706" y="1550" class="st">Tier 0 冻结（预算/停止/状态机/scope）· Tier 1 提案制 · Tier 2 可自改</text>
  <text x="706" y="1570" class="st">先决条件：holdout 集（现缺）+ 不变量层上线</text>

  <!-- ═══ 右脊 ═══ -->
  <text x="1260" y="168" class="lyr">中枢与护栏</text>
  <rect x="1260" y="180" width="300" height="110" rx="10" class="boxd"/>
  <text x="1276" y="206" class="bt">InvariantLayer · 底线</text>
  <text x="1276" y="230" class="st">预算 · 停止 · 状态机 · scope</text>
  <text x="1276" y="250" class="st">独立于插件 · 不可被覆盖</text>
  <text x="1276" y="274" class="sm">切 A5（DSH §9.7 模式）</text>

  <rect x="1260" y="310" width="300" height="100" rx="10" class="box"/>
  <text x="1276" y="336" class="bt">CapabilityRegistry · 供给</text>
  <text x="1276" y="360" class="st">resolve(kind, **criteria)</text>
  <text x="1276" y="380" class="st">扩展 core/registry.py（不新建）</text>
  <text x="1276" y="398" class="sm">切 0.6 · 0.7</text>

  <rect x="1260" y="430" width="300" height="120" rx="10" class="boxb"/>
  <text x="1276" y="456" class="hub">ConfigHub · 配置中心</text>
  <text x="1276" y="480" class="st">分层装载：代码默认 &lt; 文件 &lt; 环境变量</text>
  <text x="1276" y="500" class="st">治理分级：运维可调 / Tier1 提案 / 敏感隔离</text>
  <text x="1276" y="520" class="st">启动校验 fail-fast · 脱敏指纹进事件流</text>
  <text x="1276" y="544" class="sm">E1 起 schema 骨架 · 各刀补自己段</text>

  <rect x="1260" y="570" width="300" height="230" rx="10" class="boxg"/>
  <text x="1276" y="596" class="bt">落刀索引</text>
  <text x="1276" y="622" class="st">P0 脊柱：E1 契约+端点+mailbox+ConfigHub →</text>
  <text x="1276" y="642" class="st">0.1–0.4 结构可信 → A3 fence → A1 引擎</text>
  <text x="1276" y="662" class="st">→ A2 控制器 → A4 上下文 → A5 不变量</text>
  <text x="1276" y="682" class="st">→ E2–E5 入口迁移 · 幂等键</text>
  <text x="1276" y="706" class="st">P1：B1 编排 · B2 缓存/预算 · B3 版本 · B4 身份 · B5 记忆</text>
  <text x="1276" y="730" class="st">P2：C1 方法论归位 · C2 Director · C3–C5</text>
  <text x="1276" y="754" class="st">P3：D1–D4 RSI（前置 holdout+不变量）</text>

  <rect x="1260" y="820" width="300" height="286" rx="10" class="boxg"/>
  <text x="1276" y="846" class="bt">决策记录</text>
  <text x="1276" y="872" class="st" style="fill:#0369a1">✓ Gateway 化 · 挂载式单进程宿主（10-24）</text>
  <text x="1276" y="892" class="st" style="fill:#0369a1">✓ queue_mode 定稿：api_chat=steer · collect 留位</text>
