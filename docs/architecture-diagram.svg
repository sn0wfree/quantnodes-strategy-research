    <circle cx="1152" cy="708" r="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="1152" y="713" fill="#991b1b">⑤</text>
    <circle cx="900" cy="368" r="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="900" y="373" fill="#991b1b">⑥</text>
