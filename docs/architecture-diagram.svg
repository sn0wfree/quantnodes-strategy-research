<desc id="d">六层（接入/编排/引擎/能力/数据+账本/横切）· 四中枢（ContextHub / CapabilityRegistry / EventStore / InvariantLayer）· 运行期环境 RunContext 带 · 三层接缝规范 · 三层基因组（RSI）。① 反向依赖 ② SSE 双轨 ③ 持久化无契约 ④ 上下文无仲裁 ⑤ 记忆断裂 ⑥ 导演层缺失 ⑦ 引擎层反向依赖 AgentLoop。</desc>

