  <text x="166" y="1280" class="st">L1 窄协议：29 复用 + 补 3（EventSource / ToolsetProvider / PersistenceContract）</text>
  <text x="166" y="1300" class="st">L2 统一注册：扩展 core/registry.py（不新建平行注册表）</text>
  <text x="166" y="1320" class="st">L3 一致性套件：每协议一套可运行 pytest</text>
