<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170" role="img" aria-labelledby="t d">
<title id="t">目标架构 v2 · 对照讨论版</title>
<desc id="d">六层（接入/编排/引擎/能力/数据+账本/横切）· 四中枢（ContextHub / CapabilityRegistry / EventStore / InvariantLayer）· 运行期环境 RunContext 带 · 三层接缝规范 · 三层基因组（RSI）。① 反向依赖 ② SSE 双轨 ③ 持久化无契约 ④ 上下文无仲裁 ⑤ 记忆断裂 ⑥ 导演层缺失 ⑦ 引擎层反向依赖 AgentLoop。</desc>

  <style>
    .lyr{font-size:14px;font-weight:600;fill:#334155}
    .bt{font-size:15px;font-weight:600;fill:#0f172a}
    .st{font-size:12.5px;fill:#475569}
    .sm{font-size:11.5px;fill:#94a3b8}
    .hub{font-size:14.5px;font-weight:600;fill:#0c4a6e}
    .hq{font-size:12.5px;fill:#0369a1}
    .mono{font-size:12px;fill:#334155;font-family:ui-monospace,Menlo,Consolas,monospace}
    .flow-lbl{font-size:12px;font-weight:500;fill:#0c4a6e}
    .box{fill:#fff;stroke:#cbd5e1;stroke-width:1}
    .boxb{fill:#e0f2fe;stroke:#7dd3fc;stroke-width:1.2}
    .boxa{fill:#fef3c7;stroke:#fcd34d;stroke-width:1.2}
    .boxd{fill:#f1f5f9;stroke:#334155;stroke-width:1.6;stroke-dasharray:7 4}
    .boxg{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1}
    .ar{stroke:#94a3b8;stroke-width:1.4;fill:none;marker-end:url(#a1)}
    .arb{stroke:#0ea5e9;stroke-width:1.4;fill:none;marker-end:url(#a2)}
    .lbl{font-size:11.5px;fill:#64748b}
  </style>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1.4"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8" fill="none" stroke="#0ea5e9" stroke-width="1.4"/></marker>
  </defs>

  <!-- ═══ 1 · 接入层 ═══ -->
  <text x="40" y="50" class="lyr">① 接入</text>
  <rect x="150" y="20" width="250" height="66" rx="9" class="box"/>
  <text x="166" y="44" class="bt">CLI / TUI</text>
  <text x="166" y="64" class="st">命令 · 终端 · 交互</text>
  <rect x="413" y="20" width="250" height="66" rx="9" class="box"/>
  <text x="429" y="44" class="bt">FastAPI（20 routers）</text>
  <text x="429" y="64" class="st">chat · study · session</text>
  <rect x="676" y="20" width="250" height="66" rx="9" class="box"/>
  <text x="692" y="44" class="bt">WebUI</text>
  <text x="692" y="64" class="st">SSE 实时流 · 时间线</text>
  <rect x="939" y="20" width="250" height="66" rx="9" class="box"/>
  <text x="955" y="44" class="bt">MCP</text>
  <text x="955" y="64" class="st">对外工具协议</text>
  <text x="150" y="106" class="sm">所有来源提交同一份 WorkRequest（kind / source / session_key / queue_mode / budget / idempotency_key）</text>
  <line x1="275" y1="112" x2="275" y2="140" class="arb"/>
  <line x1="538" y1="112" x2="538" y2="140" class="arb"/>
  <line x1="801" y1="112" x2="801" y2="140" class="arb"/>
  <line x1="1064" y1="112" x2="1064" y2="140" class="arb"/>
  <text x="500" y="130" class="flow-lbl">WorkRequest（统一提交）</text>

  <!-- ═══ 2 · 统一入口 ═══ -->
  <text x="40" y="170" class="lyr">② 统一入口</text>
  <rect x="150" y="140" width="1039" height="160" rx="10" class="boxb"/>
  <text x="166" y="166" class="hub">WorkEntry（统一入口协议 · 切 E1）</text>
  <text x="166" y="188" class="hq">submit(req: WorkRequest) → RunHandle　｜　subscribe(session_key) → AsyncIterator[Event]　｜　cancel / status(handle)</text>
  <line x1="166" y1="200" x2="1173" y2="200" stroke="#bae6fd"/>
  <text x="166" y="220" class="st">所有来源走同一份协议：一个 sessionKey 跨渠道 · 一种 agent RPC · 一条事件流 · 幂等键（副作用可安全重试）</text>
  <text x="166" y="242" class="st">队列模式按来源选：CLI = followup · API chat = steer/followup · automation = interrupt · Director propose = followup</text>
  <text x="166" y="264" class="st">「事件不重放，缺口靠刷新」　｜　准入拒绝是结构性的（并发满 / 预算尽），不是模型被请求遵守</text>
  <text x="166" y="288" class="sm">前置：E1（1d 协议）→ E2–E4（3.5d 逐入口迁移）→ E5（0.5d 幂等键）</text>

  <!-- ═══ 3 · 控制面 ═══ -->
  <line x1="275" y1="300" x2="275" y2="330" class="arb"/>
  <text x="285" y="320" class="flow-lbl">RunHandle（准入通过）</text>
  <text x="40" y="380" class="lyr">③ 控制面</text>

  <rect x="150" y="330" width="560" height="280" rx="10" class="boxb"/>
  <text x="166" y="356" class="hub">SessionController（唯一 owner · 切 A2）</text>
  <text x="166" y="376" class="hq">回答：谁下一个可以跑（turn 准入）—— chat 与 study 共用</text>
  <line x1="166" y1="388" x2="694" y2="388" stroke="#bae6fd"/>
  <text x="166" y="408" class="st">7 阶段：idle / admitting / preparing / running / finishing / settling / mutating</text>
  <text x="166" y="428" class="st">队列模式：steer / followup / collect / interrupt（与 WorkEntry 对齐）</text>
  <text x="166" y="448" class="hq">6 个正交真值：owned / admissible / active / injectable / abortable / settled</text>
  <text x="166" y="470" class="st">write fence：activeRunId 认领 + 提交校验（取代的 run 不得提交陈旧数据）</text>
  <text x="166" y="490" class="st">身份分离：logical key ≠ incarnation ≠ operation ≠ attempt</text>
  <text x="166" y="514" class="st">停止三层：准入（开不开）· 执行（超不超）· 内容（要不要再来）</text>
  <text x="166" y="538" class="sm">切 A2（骨架）· A3（fence）· B4（身份）</text>

  <rect x="730" y="330" width="220" height="280" rx="10" class="boxd"/>
  <text x="746" y="356" class="hub" style="fill:#0f172a">Director（策略）</text>
  <text x="746" y="376" class="hq" style="fill:#334155">这一轮跑什么</text>
  <text x="746" y="398" class="st">停因 → 动作映射</text>
  <text x="746" y="416" class="st">propose_next</text>
  <text x="746" y="434" class="st">派生 / 矛盾 假设</text>
  <text x="746" y="456" class="st">产出＝BranchContext</text>
  <text x="746" y="476" class="st">（现有契约复用）</text>
  <text x="746" y="502" class="sm">切 C2 · 1.1</text>
  <text x="746" y="522" class="sm">红线：不得读预算</text>
  <text x="746" y="542" class="sm">　　　不得自行开 run</text>

  <rect x="970" y="330" width="220" height="280" rx="10" class="boxd"/>
  <text x="986" y="356" class="hub" style="fill:#0f172a">RunContext（运行期环境）</text>
  <text x="986" y="376" class="hq" style="fill:#334155">在什么约束下跑</text>
  <text x="986" y="398" class="st">预算（余量快照）</text>
  <text x="986" y="416" class="st">事件出口（EventSink）</text>
  <text x="986" y="434" class="st">追踪（TraceView）</text>
  <text x="986" y="452" class="st">取消（CancelScope）</text>
  <text x="986" y="474" class="st">快照（从事件 fold）</text>
  <text x="986" y="498" class="sm">切 A4 · 由控制器创建</text>
  <text x="986" y="518" class="sm">红线：不含「做什么」</text>
  <text x="986" y="538" class="sm">　　　per-run，非全局单例</text>

  <!-- ═══ 4 · 执行面 ═══ -->
  <line x1="275" y1="610" x2="275" y2="640" class="arb"/>
  <text x="285" y="630" class="flow-lbl">intent（BranchContext）+ RunContext</text>
  <text x="40" y="700" class="lyr">④ 执行面</text>

  <rect x="150" y="640" width="1039" height="54" rx="9" class="boxa"/>
  <text x="166" y="664" class="bt">AgentRuntime 协议 —— prepare / run / settle（切 A1）</text>
  <text x="166" y="684" class="st">选择序：model-scoped &gt; provider-scoped &gt; auto 认领 &gt; 内置回退　｜　不支持则拒绝，不降级　｜　失败不经另一 runtime 重放</text>

  <rect x="150" y="710" width="330" height="140" rx="9" class="box"/>
  <text x="166" y="736" class="bt">ReActRuntime</text>
  <text x="166" y="758" class="st">由 core/agent/loop.py 迁入</text>
  <text x="166" y="778" class="st">（AgentLoop + 7 mixin + 9 step）</text>
  <text x="166" y="798" class="st">一次 ReAct 迭代</text>
  <text x="166" y="826" class="sm">切 A1</text>

  <rect x="500" y="710" width="330" height="140" rx="9" class="box"/>
  <text x="516" y="736" class="bt">ResearchRuntime</text>
  <text x="516" y="758" class="st">由 core/study/phase_engine.py 迁入</text>
  <text x="516" y="778" class="st">phases / langgraph 两分支</text>
  <text x="516" y="798" class="st">跑一轮研究</text>
  <text x="516" y="826" class="sm">切 B1</text>

  <rect x="850" y="710" width="339" height="140" rx="9" class="box"/>
  <text x="866" y="736" class="bt">DagRuntime</text>
  <text x="866" y="758" class="st">由 core/swarm/runtime.py 迁入</text>
  <text x="866" y="778" class="st">DAG 分层并行</text>
  <text x="866" y="798" class="st">多 agent 批次</text>
  <text x="866" y="826" class="sm">切 B1</text>

  <!-- ═══ 5 · 上下文 ═══ -->
  <line x1="315" y1="850" x2="315" y2="880" class="arb"/>
  <line x1="665" y1="850" x2="665" y2="880" class="arb"/>
  <line x1="1020" y1="850" x2="1020" y2="880" class="arb"/>
  <text x="325" y="870" class="flow-lbl">每次模型调用前</text>
  <text x="40" y="940" class="lyr">⑤ 上下文</text>

  <rect x="150" y="880" width="520" height="140" rx="9" class="boxb"/>
  <text x="166" y="906" class="hub">ContextHub（模型看到什么 · 唯一所有者）</text>
  <text x="166" y="928" class="hq">collect → arbitrate（唯一 token 账本）→ render → explain</text>
  <text x="166" y="950" class="st">缓存边界：稳定段在上 / 目录在下（刷新不改前缀字节）</text>
  <text x="166" y="970" class="st">预算归属：谁产出谁拥有（分层：attempt/provider/idle/总）</text>
  <text x="166" y="996" class="sm">validate() 复活为强制门禁　｜　切 A4 · B2 · 2.3</text>

  <rect x="690" y="880" width="499" height="140" rx="9" class="boxb"/>
  <text x="706" y="906" class="hub">ContextProvider 协议</text>
  <text x="706" y="928" class="hq">goal / todo / memory / hypothesis / knowledge</text>
  <text x="706" y="950" class="st">只取数 + 标注（kind·source·created_at·confidence·scope）</text>
  <text x="706" y="970" class="st">不做业务；不做渲染；不改控制流</text>
  <text x="706" y="996" class="sm">切 1.7（injector→provider）· B5（记忆三改）</text>

  <!-- ═══ 6 · 研究域 ═══ -->
  <line x1="430" y1="1020" x2="430" y2="1060" class="arb"/>
  <text x="440" y="1050" class="flow-lbl">产物（hypothesis · claims · metrics · journal）</text>
  <text x="40" y="1110" class="lyr">⑥ 研究域</text>
  <text x="40" y="1128" class="sm">我们的 IP</text>

  <rect x="150" y="1060" width="520" height="120" rx="9" class="boxa"/>
  <text x="166" y="1086" class="bt">研究方法论 core/study/method/（不动）</text>
  <text x="166" y="1108" class="st">假设 → 派生 → 证伪(claims) → AEGIS 新颖性/回归门</text>
  <text x="166" y="1128" class="st">→ 两阶段 journal（capture → backfill）</text>
  <text x="166" y="1156" class="sm">切 C1（归位）——等控制面 OK 后再动</text>
  <rect x="690" y="1060" width="499" height="120" rx="9" class="box"/>
  <text x="706" y="1086" class="bt">账本</text>
  <text x="706" y="1108" class="st">goal / hypothesis / study —— 四类存储契约</text>
  <text x="706" y="1128" class="st">真源 · 写入者 · 生命周期 · 幂等</text>
  <text x="706" y="1156" class="sm">切 0.4（契约）· B4（身份分离）</text>

  <!-- ═══ 7 · 数据层 ═══ -->
  <line x1="430" y1="1180" x2="430" y2="1210" class="arb"/>
  <text x="440" y="1200" class="flow-lbl">持久化</text>
  <text x="40" y="1260" class="lyr">⑦ 数据</text>

  <rect x="150" y="1210" width="250" height="100" rx="9" class="box"/>
  <text x="166" y="1234" class="bt">event_store（事实流）</text>
  <text x="166" y="1254" class="st">emit 三助手 · subscribe</text>
  <text x="166" y="1274" class="st">LLM_REQUEST 已记 system+tools</text>
  <text x="166" y="1296" class="sm">切 0.2 SSE 双轨 · 1.6 协议化</text>
  <rect x="413" y="1210" width="250" height="100" rx="9" class="box"/>
  <text x="429" y="1234" class="bt">DuckDB</text>
  <text x="429" y="1254" class="st">回测结果 · 价格 · 因子</text>
  <text x="429" y="1274" class="st">db.py 1248 行</text>
  <text x="429" y="1296" class="sm">切 2.4 读写分仓</text>
  <rect x="676" y="1210" width="250" height="100" rx="9" class="box"/>
  <text x="692" y="1234" class="bt">sqlite 三库</text>
  <text x="692" y="1254" class="st">session · study · goal</text>
  <text x="692" y="1274" class="st">user_version 迁移</text>
  <text x="692" y="1296" class="sm">切 2.4 拆分</text>
  <rect x="939" y="1210" width="250" height="100" rx="9" class="box"/>
  <text x="955" y="1234" class="bt">workspace FS</text>
  <text x="955" y="1254" class="st">strategy.py · results.tsv</text>
  <text x="955" y="1274" class="st">round 目录 · 可 git 面</text>
  <text x="955" y="1296" class="sm">研究产出（Tier 2）</text>

  <!-- ═══ 8 · 底带 ═══ -->
  <rect x="150" y="1350" width="520" height="130" rx="10" class="boxg"/>
  <text x="166" y="1376" class="bt">接缝规范</text>
  <text x="166" y="1400" class="st">L1 窄协议：29 复用 + 补 3（EventSource/ToolsetProvider/PersistenceContract）</text>
  <text x="166" y="1420" class="st">L2 统一注册：扩展 core/registry.py（不新建平行注册表）</text>
  <text x="166" y="1440" class="st">L3 一致性套件：每协议一套可运行 pytest</text>
  <text x="166" y="1466" class="sm">+ 协议版本化：PROTOCOL_VERSION，不匹配即拒绝（切 B3）</text>
  <rect x="690" y="1350" width="499" height="130" rx="10" class="boxa"/>
  <text x="706" y="1376" class="bt">基因组（RSI）· 只改行为工件</text>
  <text x="706" y="1400" class="st">Tier 0 冻结：预算/停止/状态机/scope —— agent 无权触碰</text>
  <text x="706" y="1420" class="st">Tier 1 提案制：.prompts / .skills / 工具集组合 → 三重门禁 → git 回滚</text>
  <text x="706" y="1440" class="st">Tier 2 可自改：strategy.py / config / 因子（研究产出，非进化）</text>
  <text x="706" y="1466" class="sm">先决条件：holdout 集（现缺）+ 不变量层上线</text>

  <!-- ═══ 右脊 ═══ -->
  <text x="1260" y="128" class="lyr">中枢与护栏</text>
  <rect x="1260" y="140" width="300" height="120" rx="10" class="boxb"/>
  <text x="1276" y="166" class="hub">CapabilityRegistry · 供给</text>
  <text x="1276" y="190" class="hq">resolve(kind, **criteria)</text>
  <text x="1276" y="210" class="hq">扩展 core/registry.py（不新建）</text>
  <text x="1276" y="236" class="sm">切 0.6 · 0.7</text>

  <rect x="1260" y="290" width="300" height="110" rx="10" class="boxb"/>
  <text x="1276" y="316" class="hub">EventStore · 事实</text>
  <text x="1276" y="340" class="hq">emit / subscribe / replay</text>
  <text x="1276" y="360" class="hq">LLM_REQUEST 已记 system+tools</text>
  <text x="1276" y="384" class="sm">切 0.2 · 1.6</text>

  <rect x="1260" y="430" width="300" height="120" rx="10" class="boxd"/>
  <text x="1276" y="456" class="hub" style="fill:#0f172a">InvariantLayer · 底线</text>
  <text x="1276" y="480" class="hq" style="fill:#334155">独立于插件 · 不可被覆盖</text>
  <text x="1276" y="500" class="hq" style="fill:#334155">预算 · 停止 · 状态机 · scope</text>
  <text x="1276" y="526" class="sm">切 A5（DSH §9.7 模式）</text>

  <rect x="1260" y="580" width="300" height="120" rx="10" class="boxg"/>
  <text x="1276" y="606" class="hub">统一快照</text>
  <text x="1276" y="630" class="hq">items / dropped / providers_used</text>
  <text x="1276" y="650" class="hq">capabilities / events_ref</text>
  <text x="1276" y="676" class="sm">切 2.6（从事件 fold）</text>

  <rect x="1260" y="730" width="300" height="210" rx="10" class="boxg"/>
  <text x="1276" y="756" class="hub">落刀索引</text>
  <text x="1276" y="782" class="st">P0 脊柱：E1 入口 · A1 runtime · A2 控制器 · A3 fence · A4 上下文 · A5 不变量 · 0.11 归位</text>
  <text x="1276" y="806" class="st">P1 收敛：B1 编排 · B2 缓存边界 · B3 协议版本 · B4 身份 · B5 记忆</text>
  <text x="1276" y="830" class="st">P2 研究域：C1 方法论归位 · C2 Director · C3 降级 · C4 清除 · C5 调度器</text>
  <text x="1276" y="854" class="st">P3 RSI：D1 holdout · D2 提案 · D3 门禁 · D4 回滚（等控制面 OK）</text>
  <text x="1276" y="880" class="st">并行项：0.1–0.4 结构可信 · 0.5 门禁 · 0.6–0.7 接缝 · 0.12 fence</text>

  <rect x="1260" y="970" width="300" height="180" rx="10" class="boxg"/>
  <text x="1276" y="996" class="hub">决策记录</text>
  <text x="1276" y="1022" class="st" style="fill:#0369a1">✓ 控制面统一为一个</text>
  <text x="1276" y="1042" class="st" style="fill:#0369a1">✓ E1 统一入口插到 A1 之前</text>
  <text x="1276" y="1062" class="st" style="fill:#0369a1">✓ P2 等控制面 OK 后再动</text>
  <text x="1276" y="1082" class="st">⏸ P0 是否两人并行（讨论中）</text>
  <line x1="1276" y1="1096" x2="1544" y2="1096" stroke="#e2e8f0"/>
  <text x="1276" y="1118" class="sm">总纲：architecture-v3-openclaw-inspired.md</text>
  <text x="1276" y="1138" class="sm">主线：refactor-master-plan-20261008.md</text>
  <text x="1276" y="1158" class="sm">对标：industry-benchmark-openclaw-20261008.md</text>

  <!-- 问题编号 -->
  <g font-size="14" font-weight="600" text-anchor="middle">
