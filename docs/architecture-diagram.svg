<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170" role="img" aria-labelledby="t d">
<title id="t">目标架构 v2 · 对照讨论版</title>
<desc id="d">六层（接入/编排/引擎/能力/数据+账本/横切）· 四中枢（ContextHub / CapabilityRegistry / EventStore / InvariantLayer）· 运行期环境 RunContext 带 · 三层接缝规范 · 三层基因组（RSI）。① 反向依赖 ② SSE 双轨 ③ 持久化无契约 ④ 上下文无仲裁 ⑤ 记忆断裂 ⑥ 导演层缺失 ⑦ 引擎层反向依赖 AgentLoop。</desc>

  <style>
    .lyr{font-size:14px;font-weight:600;fill:#334155}
    .bt{font-size:15px;font-weight:600;fill:#0f172a}
    .st{font-size:12.5px;fill:#475569}
    .sm{font-size:11.5px;fill:#94a3b8}
    .hub{font-size:14.5px;font-weight:600;fill:#0c4a6e}
    .hq{font-size:12.5px;fill:#0369a1}
    .mono{font-size:12px;fill:#334155;font-family:ui-monospace,Menlo,Consolas,monospace}
    .box{fill:#fff;stroke:#cbd5e1;stroke-width:1}
    .boxb{fill:#e0f2fe;stroke:#7dd3fc;stroke-width:1.2}
    .boxa{fill:#fef3c7;stroke:#fcd34d;stroke-width:1.2}
    .boxd{fill:#f1f5f9;stroke:#334155;stroke-width:1.6;stroke-dasharray:7 4}
    .boxg{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1}
    .ar{stroke:#94a3b8;stroke-width:1.4;fill:none;marker-end:url(#a1)}
    .arb{stroke:#0ea5e9;stroke-width:1.4;fill:none;marker-end:url(#a2)}
    .lbl{font-size:11.5px;fill:#64748b}
  </style>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1.4"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8" fill="none" stroke="#0ea5e9" stroke-width="1.4"/></marker>
  </defs>

  <!-- ══════ 接入层 ══════ -->
  <text x="40" y="74" class="lyr">接入</text>
  <rect x="150" y="30" width="250" height="76" rx="9" class="box"/>
  <text x="166" y="56" class="bt">CLI / TUI</text>
  <text x="166" y="76" class="st">命令 · 终端 · 交互 REPL</text>
  <text x="166" y="94" class="sm">toolset 按角色解析</text>
  <rect x="413" y="30" width="250" height="76" rx="9" class="box"/>
  <text x="429" y="56" class="bt">FastAPI（20 routers）</text>
  <text x="429" y="76" class="st">chat · study · session · agent</text>
  <text x="429" y="94" class="sm">study 路由 33 个 · 待切面</text>
  <rect x="676" y="30" width="250" height="76" rx="9" class="box"/>
  <text x="692" y="56" class="bt">WebUI</text>
  <text x="692" y="76" class="st">SSE 实时流 · 事件时间线</text>
  <text x="692" y="94" class="sm">读 event_store 投影</text>
  <rect x="939" y="30" width="250" height="76" rx="9" class="box"/>
  <text x="955" y="56" class="bt">MCP</text>
  <text x="955" y="76" class="st">对外工具协议</text>
  <text x="955" y="94" class="sm">工具经 plugin 接入</text>

  <line x1="275" y1="106" x2="275" y2="140" class="ar"/>
  <line x1="538" y1="106" x2="538" y2="140" class="ar"/>
  <line x1="801" y1="106" x2="801" y2="140" class="ar"/>
  <line x1="1064" y1="106" x2="1064" y2="140" class="ar"/>

  <!-- ══════ 编排层：1 个控制面 ══════ -->
  <text x="40" y="240" class="lyr">编排</text>
  <text x="40" y="258" class="sm">1 个控制面</text>
  <text x="40" y="274" class="sm">+ 策略 + 环境</text>

  <rect x="150" y="140" width="560" height="250" rx="10" class="boxb"/>
  <text x="166" y="166" class="hub">SessionController（唯一 owner）</text>
  <text x="166" y="188" class="hq">回答：谁下一个可以跑（turn 准入）—— chat 与 study 共用</text>
  <line x1="166" y1="200" x2="694" y2="200" stroke="#bae6fd"/>
  <text x="166" y="222" class="st">7 阶段：idle / admitting / preparing / running / finishing / settling / mutating</text>
  <text x="166" y="244" class="st">队列模式：steer / followup / collect / interrupt</text>
  <text x="166" y="264" class="hq">　→ directive = steer · HITL pause = 准入闸 · 停因 = 终态 + 续轮决策</text>
  <text x="166" y="288" class="st">6 个正交真值：owned / admissible / active / injectable / abortable / settled</text>
  <text x="166" y="310" class="st">write fence：activeRunId 认领 + 提交校验（取代的 run 不得提交陈旧数据）</text>
  <text x="166" y="330" class="st">身份分离：logical key ≠ incarnation ≠ operation ≠ attempt</text>
  <text x="166" y="362" class="sm">切 A2（骨架 · 等价迁移 · 分两 PR）· A3（fence）· B4（身份分离）</text>

  <rect x="730" y="140" width="220" height="250" rx="10" class="boxd"/>
  <text x="746" y="166" class="hub" style="fill:#0f172a">Director（策略）</text>
  <text x="746" y="188" class="hq" style="fill:#334155">下一步做什么</text>
  <text x="746" y="212" class="st">停因 → 动作映射</text>
  <text x="746" y="232" class="st">propose_next</text>
  <text x="746" y="252" class="st">派生 / 矛盾 假设</text>
  <text x="746" y="278" class="sm">切 C2</text>
  <text x="746" y="298" class="sm">（等控制面 OK 后）</text>

  <rect x="970" y="140" width="220" height="250" rx="10" class="boxd"/>
  <text x="986" y="166" class="hub" style="fill:#0f172a">RunContext（运行期环境）</text>
  <text x="986" y="188" class="hq" style="fill:#334155">预算 · 事件 · 追踪</text>
  <text x="986" y="208" class="hq" style="fill:#334155">取消 · 快照</text>
  <text x="986" y="232" class="st">唯一实现</text>
  <text x="986" y="252" class="st">三处共用</text>
  <text x="986" y="278" class="sm">切 A4</text>
  <text x="986" y="298" class="sm">（编排层只注入，不实现）</text>

  <!-- ══════ 能力层：N 个执行面 ══════ -->
  <text x="40" y="500" class="lyr">能力</text>
  <text x="40" y="518" class="sm">N 个执行面</text>
  <text x="40" y="534" class="sm">（可换）</text>

  <rect x="150" y="420" width="1039" height="54" rx="9" class="boxa"/>
  <text x="166" y="444" class="bt">AgentRuntime 协议 —— prepare / run / settle</text>
  <text x="166" y="464" class="st">选择序：model-scoped 策略 &gt; provider-scoped &gt; auto 认领 &gt; 内置回退　｜　不支持则拒绝，不静默降级　｜　一旦开始执行，其失败不经另一 runtime 重放</text>

  <rect x="150" y="494" width="330" height="140" rx="9" class="box"/>
  <text x="166" y="520" class="bt">ReActRuntime</text>
  <text x="166" y="542" class="st">由 core/agent/loop.py 迁入</text>
  <text x="166" y="562" class="st">（AgentLoop + 7 mixin + 9 step）</text>
  <text x="166" y="586" class="st">一次 ReAct 迭代</text>
  <text x="166" y="614" class="sm">切 A1</text>

  <rect x="500" y="494" width="330" height="140" rx="9" class="box"/>
  <text x="516" y="520" class="bt">ResearchRuntime</text>
  <text x="516" y="542" class="st">由 core/study/phase_engine.py 迁入</text>
  <text x="516" y="562" class="st">phases / langgraph 两分支</text>
  <text x="516" y="586" class="st">跑一轮研究</text>
  <text x="516" y="614" class="sm">切 B1</text>

  <rect x="850" y="494" width="339" height="140" rx="9" class="box"/>
  <text x="866" y="520" class="bt">DagRuntime</text>
  <text x="866" y="542" class="st">由 core/swarm/runtime.py 迁入</text>
  <text x="866" y="562" class="st">DAG 分层并行</text>
  <text x="866" y="586" class="st">多 agent 批次</text>
  <text x="866" y="614" class="sm">切 B1</text>

  <!-- ══════ 上下文：平台唯一所有者 ══════ -->
  <text x="40" y="710" class="lyr">上下文</text>
  <text x="40" y="728" class="sm">平台独占</text>

  <rect x="150" y="660" width="520" height="140" rx="9" class="boxb"/>
  <text x="166" y="686" class="hub">ContextHub（模型看到什么 · 唯一所有者）</text>
  <text x="166" y="708" class="hq">collect → arbitrate（唯一 token 账本）→ render → explain</text>
  <text x="166" y="730" class="st">缓存边界：稳定段在上 / 目录在下（刷新不改前缀字节）</text>
  <text x="166" y="750" class="st">预算归属：谁产出谁拥有（分层：attempt/provider/idle/总）</text>
  <text x="166" y="776" class="sm">validate() 复活为强制门禁　｜　切 A4 · B2 · 2.3</text>

  <rect x="690" y="660" width="499" height="140" rx="9" class="boxb"/>
  <text x="706" y="686" class="hub">ContextProvider 协议</text>
  <text x="706" y="708" class="hq">goal / todo / memory / hypothesis / knowledge</text>
  <text x="706" y="730" class="st">只取数 + 标注（kind·source·created_at·confidence·scope）</text>
  <text x="706" y="750" class="st">不做业务；不做渲染；不改控制流</text>
  <text x="706" y="776" class="sm">切 1.7（injector→provider）· B5（记忆三改）</text>

  <line x1="430" y1="390" x2="430" y2="420" class="ar"/>
  <line x1="840" y1="390" x2="840" y2="420" class="ar"/>
  <line x1="1080" y1="390" x2="1080" y2="420" class="ar"/>
  <line x1="315" y1="634" x2="315" y2="660" class="ar"/>
  <line x1="665" y1="634" x2="665" y2="660" class="ar"/>
  <line x1="1020" y1="634" x2="1020" y2="660" class="ar"/>

  <!-- ══════ 研究域（IP） ══════ -->
  <text x="40" y="880" class="lyr">研究域</text>
  <text x="40" y="898" class="sm">我们的 IP</text>
  <rect x="150" y="830" width="520" height="120" rx="9" class="boxa"/>
  <text x="166" y="856" class="bt">研究方法论 core/study/method/（不动）</text>
  <text x="166" y="878" class="st">假设 → 派生 → 证伪(claims) → AEGIS 新颖性/回归门</text>
  <text x="166" y="898" class="st">→ 两阶段 journal（capture → backfill）</text>
  <text x="166" y="926" class="sm">切 C1（归位）——等控制面 OK 后再动</text>
  <rect x="690" y="830" width="499" height="120" rx="9" class="box"/>
  <text x="706" y="856" class="bt">账本</text>
  <text x="706" y="878" class="st">goal / hypothesis / study —— 四类存储契约</text>
  <text x="706" y="898" class="st">真源 · 写入者 · 生命周期 · 幂等</text>
  <text x="706" y="926" class="sm">切 0.4（契约）· B4（身份分离）</text>

  <line x1="665" y1="950" x2="665" y2="980" class="ar"/>
  <text x="675" y="968" class="lbl">产物落账本</text>

  <!-- ══════ 数据层 ══════ -->
  <text x="40" y="1030" class="lyr">数据</text>
  <rect x="150" y="980" width="250" height="110" rx="9" class="box"/>
  <text x="166" y="1006" class="bt">event_store（事实流）</text>
  <text x="166" y="1028" class="st">emit 三助手 · subscribe</text>
  <text x="166" y="1048" class="st">LLM_REQUEST 已记 system+tools</text>
  <text x="166" y="1072" class="sm">切 0.2 SSE 双轨 · 1.6 协议化</text>
  <rect x="413" y="980" width="250" height="110" rx="9" class="box"/>
  <text x="429" y="1006" class="bt">DuckDB</text>
  <text x="429" y="1028" class="st">回测结果 · 价格 · 因子</text>
  <text x="429" y="1048" class="st">db.py 1248 行</text>
  <text x="429" y="1072" class="sm">切 2.4 读写分仓</text>
  <rect x="676" y="980" width="250" height="110" rx="9" class="box"/>
  <text x="692" y="1006" class="bt">sqlite 三库</text>
  <text x="692" y="1028" class="st">session · study · goal</text>
  <text x="692" y="1048" class="st">user_version 迁移</text>
  <text x="692" y="1072" class="sm">切 2.4 拆分</text>
  <rect x="939" y="980" width="250" height="110" rx="9" class="box"/>
  <text x="955" y="1006" class="bt">workspace FS</text>
  <text x="955" y="1028" class="st">strategy.py · results.tsv</text>
  <text x="955" y="1048" class="st">round 目录 · 可 git 面</text>
  <text x="955" y="1072" class="sm">研究产出（Tier 2）</text>

  <!-- ══════ 底带 ══════ -->
  <rect x="150" y="1120" width="520" height="130" rx="10" class="boxg"/>
  <text x="166" y="1146" class="bt">接缝规范</text>
  <text x="166" y="1170" class="st">L1 窄协议：29 复用 + 补 3（EventSource/ToolsetProvider/PersistenceContract）</text>
  <text x="166" y="1190" class="st">L2 统一注册：扩展 core/registry.py（不新建平行注册表）</text>
  <text x="166" y="1210" class="st">L3 一致性套件：每协议一套可运行 pytest</text>
  <text x="166" y="1236" class="sm">+ 协议版本化：PROTOCOL_VERSION，不匹配即拒绝（切 B3）</text>
  <rect x="690" y="1120" width="499" height="130" rx="10" class="boxa"/>
  <text x="706" y="1146" class="bt">基因组（RSI）· 只改行为工件</text>
  <text x="706" y="1170" class="st">Tier 0 冻结：预算/停止/状态机/scope —— agent 无权触碰</text>
  <text x="706" y="1190" class="st">Tier 1 提案制：.prompts / .skills / 工具集组合 → 三重门禁 → git 回滚</text>
  <text x="706" y="1210" class="st">Tier 2 可自改：strategy.py / config / 因子（研究产出，非进化）</text>
  <text x="706" y="1236" class="sm">先决条件：holdout 集（现缺）+ 不变量层上线</text>

  <!-- ══════ 右脊 ══════ -->
  <text x="1260" y="128" class="lyr">中枢与护栏</text>
  <rect x="1260" y="140" width="300" height="120" rx="10" class="boxb"/>
  <text x="1276" y="166" class="hub">CapabilityRegistry · 供给</text>
  <text x="1276" y="190" class="hq">resolve(kind, **criteria)</text>
  <text x="1276" y="210" class="hq">扩展 core/registry.py（不新建）</text>
  <text x="1276" y="236" class="sm">切 0.6 · 0.7</text>

  <rect x="1260" y="290" width="300" height="110" rx="10" class="boxb"/>
  <text x="1276" y="316" class="hub">EventStore · 事实</text>
  <text x="1276" y="340" class="hq">emit / subscribe / replay</text>
  <text x="1276" y="360" class="hq">LLM_REQUEST 已记 system+tools</text>
  <text x="1276" y="384" class="sm">切 0.2 · 1.6</text>

  <rect x="1260" y="430" width="300" height="120" rx="10" class="boxd"/>
  <text x="1276" y="456" class="hub" style="fill:#0f172a">InvariantLayer · 底线</text>
  <text x="1276" y="480" class="hq" style="fill:#334155">独立于插件 · 不可被覆盖</text>
  <text x="1276" y="500" class="hq" style="fill:#334155">预算 · 停止 · 状态机 · scope</text>
  <text x="1276" y="526" class="sm">切 A5（DSH §9.7 模式）</text>

  <rect x="1260" y="580" width="300" height="120" rx="10" class="boxg"/>
  <text x="1276" y="606" class="hub">统一快照</text>
  <text x="1276" y="630" class="hq">items / dropped / providers_used</text>
  <text x="1276" y="650" class="hq">capabilities / events_ref</text>
  <text x="1276" y="676" class="sm">切 2.6（从事件 fold）</text>

  <rect x="1260" y="730" width="300" height="210" rx="10" class="boxg"/>
  <text x="1276" y="756" class="hub">落刀索引</text>
  <text x="1276" y="782" class="st">P0 脊柱：A1–A5</text>
  <text x="1276" y="802" class="st">P1 收敛：B1–B5</text>
  <text x="1276" y="822" class="st">P2 研究域：C1–C5（等控制面 OK）</text>
  <text x="1276" y="842" class="st">P3 RSI：D1–D4（最后）</text>
  <line x1="1276" y1="856" x2="1544" y2="856" stroke="#e2e8f0"/>
  <text x="1276" y="878" class="sm">A1 runtime · A2 控制器 · A3 fence</text>
  <text x="1276" y="898" class="sm">A4 上下文 · A5 不变量</text>
  <text x="1276" y="922" class="sm">B1 编排收敛 · B2 缓存边界</text>
  <text x="1276" y="942" class="sm">B3 协议版本 · B4 身份 · B5 记忆</text>

  <rect x="1260" y="970" width="300" height="160" rx="10" class="boxg"/>
  <text x="1276" y="996" class="hub">决策记录</text>
  <text x="1276" y="1022" class="st" style="fill:#0369a1">✓ 控制面统一为一个</text>
  <text x="1276" y="1042" class="st" style="fill:#0369a1">✓ P2 等控制面 OK 后再动</text>
  <text x="1276" y="1062" class="st">⏸ P0 是否两人并行（讨论中）</text>
  <line x1="1276" y1="1076" x2="1544" y2="1076" stroke="#e2e8f0"/>
  <text x="1276" y="1100" class="sm">总纲：architecture-v3-openclaw-inspired.md</text>
  <text x="1276" y="1120" class="sm">主线：refactor-master-plan-20261008.md</text>

