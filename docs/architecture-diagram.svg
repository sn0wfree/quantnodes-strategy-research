  <rect x="150" y="1010" width="520" height="120" rx="10" class="boxg"/>
  <text x="166" y="1036" class="bt">接缝规范</text>
  <text x="166" y="1060" class="st">L1 窄协议：29 复用 + 补 3（EventSource / ToolsetProvider / PersistenceContract）</text>
  <text x="166" y="1080" class="st">L2 统一注册：扩展 core/registry.py（不新建平行注册表）</text>
  <text x="166" y="1100" class="st">L3 一致性套件：每协议一套可运行 pytest</text>
  <text x="166" y="1120" class="sm">接入成本目标：1 文件 + 1 行 + 1 套件</text>
  <rect x="690" y="1010" width="499" height="120" rx="10" class="boxa"/>
  <text x="706" y="1036" class="bt">基因组（RSI）· 只改行为工件</text>
  <text x="706" y="1060" class="st">Tier 0 冻结：预算/停止/状态机/scope —— agent 无权触碰</text>
  <text x="706" y="1080" class="st">Tier 1 提案制：.prompts / .skills / 工具集组合 → 三重门禁 → git 回滚</text>
  <text x="706" y="1100" class="st">Tier 2 可自改：strategy.py / config / 因子（研究产出，非进化）</text>
  <text x="706" y="1120" class="sm">先决条件：holdout 集（现缺）+ 不变量层上线</text>

